services:
  mysql:
    image: nani8790/database:1.0.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: bankdb
      MYSQL_USER: bankapp
      MYSQL_PASSWORD: bankpass123
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mysql_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  auth:
    image: nani8790/auth:1.0.0
    environment:
      DB_HOST: mysql
      DB_NAME: bankdb
      DB_USER: bankapp
      DB_PASSWORD: bankpass123
    networks:
      - mysql_net
      - frontend_net
    depends_on: [mysql]
    deploy:
      replicas: 3

  bank:
    image: nani8790/bank:1.0.0
    environment:
      DB_HOST: mysql
      DB_NAME: bankdb
      DB_USER: bankapp
      DB_PASSWORD: bankpass123
    networks:
      - mysql_net
      - frontend_net
    depends_on: [mysql]
    deploy:
      replicas: 3

  frontend:
    image: nani8790/frontend:1.0.0
    ports:
      - "80:80"
    networks:
      - frontend_net
    depends_on: [auth, bank]
    deploy:
      replicas: 3

volumes:
  mysql-data:

networks:
  mysql_net:
    driver: overlay
  frontend_net:
    driver: overlay
