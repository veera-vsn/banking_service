server {
    listen 80;

    # the web page
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # /api/auth/login  ->  http://auth:8080/login   (the trailing slashes strip the prefix)
    location /api/auth/ {
        proxy_pass http://auth:8080/;
        proxy_connect_timeout 3s;     # fail fast when the service is down (-> 502 / 504)
        proxy_read_timeout 10s;
    }

    # /api/bank/balance  ->  http://bank:8080/balance
    location /api/bank/ {
        proxy_pass http://bank:8080/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
